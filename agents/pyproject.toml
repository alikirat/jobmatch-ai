[project]
name = "jobmatch-agents"
version = "0.1.0"
description = "JobMatch AI agent graph workflow (Google ADK 2.0) — ingest, score, gap analysis, and resume optimization nodes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=0.1",
    "pydantic>=2.8",
    "motor>=3.5",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
# Tests import the package as `agents.nodes...`; this puts the repo root
# (the parent of this directory) on sys.path so that resolves.
pythonpath = [".."]
testpaths = ["tests"]
markers = [
    "integration: requires a live external service (MongoDB or the real Adzuna API); skipped unless the corresponding environment variables are set",
]
